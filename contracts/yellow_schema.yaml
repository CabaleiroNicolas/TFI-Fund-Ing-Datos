version: 1
dataset: yellow_taxi_trips
descripcion: Contrato de esquema destino de los viajes de taxi amarillo (TLC).

politicas:
  columna_faltante_requerida: error
  columna_faltante_opcional: usar_default
  columna_nueva_no_contratada: advertir_e_ignorar   # decisión a revisar
  tipo_distinto: castear_si_es_seguro_sino_error

columnas:
  - nombre: vendor_id
    origen: VendorID
    tipo: INTEGER
    requerida: true
    descripcion: Código del proveedor que reportó el viaje.
  - nombre: tpep_pickup_datetime
    origen: tpep_pickup_datetime
    tipo: TIMESTAMP
    requerida: true
    descripcion: Fecha y hora en que se activó el taxímetro (subida).
  - nombre: tpep_dropoff_datetime
    origen: tpep_dropoff_datetime
    tipo: TIMESTAMP
    requerida: true
    descripcion: Fecha y hora en que se desactivó el taxímetro (bajada).
  - nombre: passenger_count
    origen: passenger_count
    tipo: BIGINT
    requerida: true
    descripcion: Cantidad de pasajeros, cargada por el conductor.
  - nombre: trip_distance
    origen: trip_distance
    tipo: DOUBLE
    requerida: true
    descripcion: Distancia del viaje en millas, según el taxímetro.
  - nombre: ratecode_id
    origen: RatecodeID
    tipo: BIGINT
    requerida: true
    descripcion: Código de tarifa vigente al final del viaje.
  - nombre: store_and_fwd_flag
    origen: store_and_fwd_flag
    tipo: VARCHAR
    requerida: true
    descripcion: Indica si el registro se guardó en el vehículo antes de enviarse al proveedor.
  - nombre: pu_location_id
    origen: PULocationID
    tipo: INTEGER
    requerida: true
    descripcion: Zona de TLC donde se activó el taxímetro (origen).
  - nombre: do_location_id
    origen: DOLocationID
    tipo: INTEGER
    requerida: true
    descripcion: Zona de TLC donde se desactivó el taxímetro (destino).
  - nombre: payment_type
    origen: payment_type
    tipo: BIGINT
    requerida: true
    descripcion: Forma de pago del viaje.
  - nombre: fare_amount
    origen: fare_amount
    tipo: DOUBLE
    requerida: true
    descripcion: Tarifa de tiempo y distancia calculada por el taxímetro.
  - nombre: extra
    origen: extra
    tipo: DOUBLE
    requerida: true
    descripcion: Extras y recargos varios (hora pico, nocturno).
  - nombre: mta_tax
    origen: mta_tax
    tipo: DOUBLE
    requerida: true
    descripcion: Impuesto MTA que se agrega automáticamente.
  - nombre: tip_amount
    origen: tip_amount
    tipo: DOUBLE
    requerida: true
    descripcion: Propina. Solo se registra automáticamente en pagos con tarjeta.
  - nombre: tolls_amount
    origen: tolls_amount
    tipo: DOUBLE
    requerida: true
    descripcion: Total de peajes pagados en el viaje.
  - nombre: improvement_surcharge
    origen: improvement_surcharge
    tipo: DOUBLE
    requerida: true
    descripcion: Recargo de mejora.
  - nombre: total_amount
    origen: total_amount
    tipo: DOUBLE
    requerida: true
    descripcion: Total cobrado al pasajero. No incluye propinas en efectivo.
  - nombre: congestion_surcharge
    origen: congestion_surcharge
    tipo: DOUBLE
    requerida: true
    descripcion: Recargo de congestión del estado de Nueva York.
  - nombre: airport_fee
    origen: Airport_fee
    tipo: DOUBLE
    requerida: true
    descripcion: Cargo por viajes desde los aeropuertos LaGuardia y JFK.
  - nombre: cbd_congestion_fee
    origen: cbd_congestion_fee
    tipo: DOUBLE
    requerida: false
    default_si_falta: null
    descripcion: Cargo de congestión de la zona céntrica de Manhattan. Existe solo desde 2025.